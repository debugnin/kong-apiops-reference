definitions:
  steps:
    - step: &deploy-kong
        name: Deploy Kong Configuration to Konnect
        image: alpine:latest
        oidc: true
        script:
          # Install required tools
          - apk add --no-cache curl tar gzip jq aws-cli bash
          - curl -sL https://github.com/kong/deck/releases/download/v1.55.0/deck_1.55.0_linux_amd64.tar.gz -o deck.tar.gz && tar -xf deck.tar.gz && cp deck /usr/local/bin/

          # Configure AWS OIDC authentication
          - export AWS_DEFAULT_REGION="${AWS_REGION:-ap-southeast-2}"
          - export AWS_WEB_IDENTITY_TOKEN_FILE=$(pwd)/web-identity-token
          - echo $BITBUCKET_STEP_OIDC_TOKEN > $AWS_WEB_IDENTITY_TOKEN_FILE
          - export AWS_ROLE_SESSION_NAME="bitbucket-${BITBUCKET_BUILD_NUMBER}"
          - echo "Attempting to assume role ${AWS_ROLE_ARN}"
          - |
            aws sts assume-role-with-web-identity \
              --role-arn "${AWS_ROLE_ARN}" \
              --role-session-name "${AWS_ROLE_SESSION_NAME}" \
              --web-identity-token file://$AWS_WEB_IDENTITY_TOKEN_FILE \
              --duration-seconds 3600 \
              --query 'Credentials' > /tmp/creds.json
          - export AWS_ACCESS_KEY_ID=$(jq -r '.AccessKeyId' /tmp/creds.json)
          - export AWS_SECRET_ACCESS_KEY=$(jq -r '.SecretAccessKey' /tmp/creds.json)
          - export AWS_SESSION_TOKEN=$(jq -r '.SessionToken' /tmp/creds.json)

          # Retrieve Konnect credentials from AWS Secrets Manager
          - |
            set -e
            echo "Retrieving Konnect credentials from AWS Secrets Manager..."
            SECRET_VALUE=$(aws secretsmanager get-secret-value --secret-id ${KONNECT_CONTROL_PLANE_SECRET_ARN} --query SecretString --output text)
            export KONNECT_TOKEN=$(echo "$SECRET_VALUE" | jq -r '.konnect_token')
            export KONNECT_CONTROL_PLANE_NAME=$(echo "$SECRET_VALUE" | jq -r '.control_plane_name')
            [ -z "$KONNECT_TOKEN" ] && echo "Error: KONNECT_TOKEN is empty" && exit 1
            [ -z "$KONNECT_CONTROL_PLANE_NAME" ] && echo "Error: KONNECT_CONTROL_PLANE_NAME is empty" && exit 1
            echo "✓ Konnect credentials retrieved. Control plane: $KONNECT_CONTROL_PLANE_NAME"

          # Validate required OIDC environment variables
          - |
            echo "Validating required OIDC environment variables..."
            [ -z "$OIDC_ISSUER" ] && echo "Error: OIDC_ISSUER is not set" && exit 1
            [ -z "$OIDC_AUDIENCE" ] && echo "Error: OIDC_AUDIENCE is not set" && exit 1
            echo "✓ All required OIDC environment variables are set"

          # Create temporary directories for configs
          - mkdir -p /tmp/kong-configs /tmp/service-plugins /tmp/global-plugins

          # Pre-process the common OIDC platform plugin (applied to every service)
          - |
            sed -e "s|\${OIDC_ISSUER}|$OIDC_ISSUER|g" \
                -e "s|\${OIDC_AUDIENCE}|$OIDC_AUDIENCE|g" \
                platform/kong/service-plugins/oidc.yaml > /tmp/service-plugins/oidc.yaml

          # Convert each service's OpenAPI spec to Kong configuration and
          # inject the common OIDC plugin. This is the common `deck`
          # conversion flow every service in this repo goes through:
          #   deck file openapi2kong  ->  deck file add-plugins
          - |
            echo "Converting OpenAPI specs to Kong configuration..."
            for service in services/*/; do
              service_name=$(basename "$service")
              [ ! -f "$service/openapi.yaml" ] && continue

              echo "  Processing service: $service_name"

              deck file openapi2kong --inso-compatible --spec "$service/openapi.yaml" --output-file "/tmp/kong-configs/${service_name}.yaml"
              echo "    ✓ Converted OpenAPI spec to Kong config"

              deck file add-plugins -s "/tmp/kong-configs/${service_name}.yaml" /tmp/service-plugins/oidc.yaml -o "/tmp/kong-configs/${service_name}.yaml"
              echo "    ✓ Common OIDC plugin applied"
            done
            echo "All services processed successfully"

          # Process global plugins with environment variable substitution
          - |
            echo "Processing global plugins with environment substitution..."
            for plugin_file in platform/kong/global-plugins/*.yaml; do
              plugin_name=$(basename "$plugin_file")
              sed -e "s|\${ENVIRONMENT_NAME}|$ENVIRONMENT_NAME|g" \
                  -e "s|\${PRODUCT_NAME}|$PRODUCT_NAME|g" \
                  "$plugin_file" > "/tmp/global-plugins/$plugin_name"
            done
            echo "✓ Global plugins processed"

          # Merge configurations: each service's converted config + global
          # plugins + consumers. This is the same `deck file merge` flow
          # used to combine any number of independently-owned config files.
          - |
            echo "Merging Kong configurations..."
            deck file merge /tmp/kong-configs/*.yaml platform/kong/consumers/*.yaml /tmp/global-plugins/*.yaml -o /tmp/final-kong.yaml
            echo "✓ Configuration merge completed"

          # Replace NEW_RELIC_API_KEY in merged configuration
          - |
            if [ -n "$NEW_RELIC_API_KEY" ]; then
              sed -i "s|\${NEW_RELIC_API_KEY}|$NEW_RELIC_API_KEY|g" /tmp/final-kong.yaml
              echo "✓ NEW_RELIC_API_KEY replaced"
            fi

          # Apply platform patches, if any
          - |
            if [ -f "platform/kong/patches/patches.yaml" ]; then
              echo "Applying patches from platform/kong/patches/patches.yaml..."
              deck file patch -s /tmp/final-kong.yaml platform/kong/patches/patches.yaml --output-file /tmp/final-kong.yaml
            fi

          # Validate the merged configuration
          - echo "Validating merged Kong configuration..."
          - deck file validate /tmp/final-kong.yaml

          # Sync configuration to Kong Konnect
          - |
            echo "Deploying to Kong Konnect..."
            deck gateway sync /tmp/final-kong.yaml \
              --konnect-addr ${KONNECT_ADDR:-https://au.api.konghq.com} \
              --konnect-control-plane-name "$KONNECT_CONTROL_PLANE_NAME" \
              --konnect-token $KONNECT_TOKEN \
              --verbose 2
          - echo "Deployment completed successfully!"

          # Copy artifacts to workspace for collection
          - cp /tmp/final-kong.yaml final-kong-deployed.yaml
        artifacts:
          - final-kong-deployed.yaml

    - step: &validate-kong
        name: Validate Kong Configuration
        image: alpine:latest
        oidc: true
        script:
          # Install required tools
          - apk add --no-cache curl tar gzip jq aws-cli bash
          - curl -sL https://github.com/kong/deck/releases/download/v1.55.0/deck_1.55.0_linux_amd64.tar.gz -o deck.tar.gz && tar -xf deck.tar.gz && cp deck /usr/local/bin/

          # Configure AWS OIDC authentication
          - export AWS_DEFAULT_REGION="${AWS_REGION:-ap-southeast-2}"
          - export AWS_WEB_IDENTITY_TOKEN_FILE=$(pwd)/web-identity-token
          - echo $BITBUCKET_STEP_OIDC_TOKEN > $AWS_WEB_IDENTITY_TOKEN_FILE
          - export AWS_ROLE_SESSION_NAME="bitbucket-${BITBUCKET_BUILD_NUMBER}"
          - |
            aws sts assume-role-with-web-identity \
              --role-arn "${AWS_ROLE_ARN}" \
              --role-session-name "${AWS_ROLE_SESSION_NAME}" \
              --web-identity-token file://$AWS_WEB_IDENTITY_TOKEN_FILE \
              --duration-seconds 3600 \
              --query 'Credentials' > /tmp/creds.json
          - export AWS_ACCESS_KEY_ID=$(jq -r '.AccessKeyId' /tmp/creds.json)
          - export AWS_SECRET_ACCESS_KEY=$(jq -r '.SecretAccessKey' /tmp/creds.json)
          - export AWS_SESSION_TOKEN=$(jq -r '.SessionToken' /tmp/creds.json)

          # Retrieve Konnect credentials from AWS Secrets Manager
          - |
            set -e
            SECRET_VALUE=$(aws secretsmanager get-secret-value --secret-id ${KONNECT_CONTROL_PLANE_SECRET_ARN} --query SecretString --output text)
            export KONNECT_TOKEN=$(echo "$SECRET_VALUE" | jq -r '.konnect_token')
            export KONNECT_CONTROL_PLANE_NAME=$(echo "$SECRET_VALUE" | jq -r '.control_plane_name')
            [ -z "$KONNECT_TOKEN" ] && echo "Error: KONNECT_TOKEN is empty" && exit 1
            [ -z "$KONNECT_CONTROL_PLANE_NAME" ] && echo "Error: KONNECT_CONTROL_PLANE_NAME is empty" && exit 1

          # Validate required OIDC environment variables
          - |
            [ -z "$OIDC_ISSUER" ] && echo "Error: OIDC_ISSUER is not set" && exit 1
            [ -z "$OIDC_AUDIENCE" ] && echo "Error: OIDC_AUDIENCE is not set" && exit 1

          - mkdir -p /tmp/kong-configs /tmp/service-plugins /tmp/global-plugins

          - |
            sed -e "s|\${OIDC_ISSUER}|$OIDC_ISSUER|g" \
                -e "s|\${OIDC_AUDIENCE}|$OIDC_AUDIENCE|g" \
                platform/kong/service-plugins/oidc.yaml > /tmp/service-plugins/oidc.yaml

          - |
            echo "Converting OpenAPI specs to Kong configuration..."
            for service in services/*/; do
              service_name=$(basename "$service")
              [ ! -f "$service/openapi.yaml" ] && continue
              echo "  Processing service: $service_name"
              deck file openapi2kong --inso-compatible --spec "$service/openapi.yaml" --output-file "/tmp/kong-configs/${service_name}.yaml"
              deck file add-plugins -s "/tmp/kong-configs/${service_name}.yaml" /tmp/service-plugins/oidc.yaml -o "/tmp/kong-configs/${service_name}.yaml"
            done

          - |
            for plugin_file in platform/kong/global-plugins/*.yaml; do
              plugin_name=$(basename "$plugin_file")
              sed -e "s|\${ENVIRONMENT_NAME}|$ENVIRONMENT_NAME|g" \
                  -e "s|\${PRODUCT_NAME}|$PRODUCT_NAME|g" \
                  "$plugin_file" > "/tmp/global-plugins/$plugin_name"
            done

          - |
            deck file merge /tmp/kong-configs/*.yaml platform/kong/consumers/*.yaml /tmp/global-plugins/*.yaml -o /tmp/final-kong.yaml

          - |
            if [ -n "$NEW_RELIC_API_KEY" ]; then
              sed -i "s|\${NEW_RELIC_API_KEY}|$NEW_RELIC_API_KEY|g" /tmp/final-kong.yaml
            fi

          - |
            if [ -f "platform/kong/patches/patches.yaml" ]; then
              deck file patch -s /tmp/final-kong.yaml platform/kong/patches/patches.yaml --output-file /tmp/final-kong.yaml
            fi

          - echo "Validating merged Kong configuration..."
          - deck file validate /tmp/final-kong.yaml

          # Show diff between current and proposed configuration
          - |
            echo "Previewing configuration changes..."
            deck gateway diff /tmp/final-kong.yaml \
              --konnect-addr ${KONNECT_ADDR:-https://au.api.konghq.com} \
              --konnect-control-plane-name "$KONNECT_CONTROL_PLANE_NAME" \
              --konnect-token $KONNECT_TOKEN || echo "Diff completed"

          - echo "Validation completed successfully!"
          - cp /tmp/final-kong.yaml final-kong-validated.yaml
        artifacts:
          - final-kong-validated.yaml

pipelines:
  branches:
    # One release branch per environment. Each branch deploys only its own
    # environment. services/*/openapi.yaml is identical across environments
    # — only the Bitbucket deployment variables differ.
    # Promote by merging forward: releases/dev -> releases/qa -> releases/uat -> releases/prd.
    "releases/dev":
      - step:
          <<: *deploy-kong
          deployment: DEV
          name: Deploy to Development

    "releases/qa":
      - step:
          <<: *deploy-kong
          deployment: QA
          name: Deploy to QA

    "releases/uat":
      - step:
          <<: *deploy-kong
          deployment: UAT
          name: Deploy to UAT
          trigger: manual

    "releases/prd":
      - step:
          <<: *deploy-kong
          deployment: Production
          name: Deploy to Production
          trigger: manual

    main:
      - step:
          <<: *deploy-kong
          deployment: DEV
          name: Deploy to Development

  pull-requests:
    "**":
      - step:
          <<: *validate-kong
          deployment: DEV
          name: Validate Kong Configuration
