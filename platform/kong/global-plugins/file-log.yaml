_format_version: "3.0"
plugins:
  - name: file-log
    enabled: true
    config:
      path: /dev/stdout
      reopen: false
      custom_fields_by_lua:
        service.name: |
          return "kong-${PRODUCT_NAME}-${ENVIRONMENT_NAME}"
        trace.id: |
          local h = kong.request.get_header('traceparent')
          if h then
            return h:match("%-([a-f0-9]+)%-[a-f0-9]+%-")
          else
            return nil
          end
        span.id: |
          local h = kong.request.get_header('traceparent')
          if h then
            return h:match("%-[a-f0-9]+%-([a-f0-9]+)%-")
          else
            return nil
          end
