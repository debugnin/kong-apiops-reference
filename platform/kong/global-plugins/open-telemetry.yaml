_format_version: "3.0"
plugins:
  - name: opentelemetry
    enabled: true
    ordering:
      before:
        access:
          - openid-connect
    config:
      resource_attributes:
        service.name: kong-${PRODUCT_NAME}-${ENVIRONMENT_NAME}
      headers:
        api-key: ${NEW_RELIC_API_KEY}
      propagation:
        default_format: w3c
        extract:
          - aws
        inject:
          - w3c
      queue:
        concurrency_limit: 1
        initial_retry_delay: 0.01
        max_batch_size: 10
        max_bytes: null
        max_coalescing_delay: 1
        max_entries: 10000
        max_retry_delay: 60
        max_retry_time: 60
      traces_endpoint: https://otlp.nr-data.net:4318/v1/traces
      metrics:
        endpoint: https://otlp.nr-data.net:4318/v1/metrics
        push_interval: 10
        enable_bandwidth_metrics: true
        enable_consumer_attribute: true
        enable_latency_metrics: true
        enable_request_metrics: true
        enable_upstream_health_metrics: true
