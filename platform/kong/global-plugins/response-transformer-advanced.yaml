_format_version: "3.0"

plugins:
  # Strips AWS Lambda Invoke-API metadata headers that the aws-lambda plugin
  # otherwise passes straight through to the client. remove.headers only
  # matches exact names (no wildcard/regex support), so this enumerates the
  # known x-amz*/x-amzn* headers the Invoke API can return.
  #
  # Note: Server is NOT listed here — it's an Nginx/Kong "builtin" header set
  # via a dedicated C-level struct field, which kong.response.clear_header()
  # (what this plugin uses under the hood) cannot actually clear. It's
  # suppressed at the source instead via KONG_HEADERS on the data-plane
  # containers (excludes server_tokens). Via is kept below since it IS
  # clearable this way, even though KONG_HEADERS now also stops it at the
  # source — harmless belt-and-suspenders.
  - name: response-transformer-advanced
    config:
      remove:
        headers:
          - X-Amz-Log-Result
          - X-Amz-Function-Error
          - X-Amz-Executed-Version
          - X-Amzn-RequestId
          - X-Amzn-Trace-Id
          - X-Amzn-Remapped-Content-Length
          - Via
