# correlation-id — an example of a *common* plugin, applied globally.
#
# This file lives under platform/kong/plugins/, not under any one
# service's services/<svc>/kong/, because it isn't scoped to one service.
# Compare services/bookings/kong/plugins.yaml and
# services/flights/kong/plugins.yaml, which hold the route-level and
# service-level plugins for those services specifically.
#
# An entry here has no `route:` or `service:` key at all, so decK treats
# it as global — it runs on every request through every service and route
# in this repo, with no per-route or per-service selection needed. Request
# tracing headers are a textbook case for this: every single request
# should get one, so scoping it would just mean listing every route (or
# every service) in the repo for no benefit.
#
# Whether a plugin belongs here (global, platform/kong/plugins/) or in one
# service's kong/plugins.yaml (route-level or service-level) is a one-time
# decision made when the plugin is introduced, driven by whether "every
# route in every service, no exceptions" is actually true for it.
#
# Other common candidates for this same global pattern: request/response
# logging, OpenTelemetry tracing, and CORS.
_format_version: "3.0"
plugins:
  - name: correlation-id
    config:
      header_name: Kong-Request-ID
      generator: uuid#counter
      echo_downstream: true
