add-plugins:
  # mTLS routes: authenticate client certificate via ALB header
  - selectors:
      - $..services[*].routes[?(@.tags[0] == 'mtls')]
    overwrite: false
    plugins:
      - name: header-cert-auth
        config:
          ca_certificates:
            - cddf62fc-a08c-4537-82ed-598ff0cd4836
          certificate_header_name: x-amzn-mtls-clientcert-leaf
          certificate_header_format: url_encoded
          consumer_by:
            - custom_id
          secure_source: false
          ssl_verify: true
          revocation_check_mode: SKIP
