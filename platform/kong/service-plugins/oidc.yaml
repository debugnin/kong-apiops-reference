add-plugins:
  # Authenticate every route via OIDC (client credentials or bearer token).
  # Applied to every service by the pipeline with `deck file add-plugins`,
  # the same template-substitution pattern used for the global plugins.
  - selectors:
      - $..services[*]
    overwrite: false
    plugins:
      - name: openid-connect
        config:
          issuer: ${OIDC_ISSUER}
          token_post_args_names:
            - audience
          token_post_args_values:
            - ${OIDC_AUDIENCE}
          auth_methods:
            - bearer
          bearer_token_param_type:
            - header
          scopes: []
          ssl_verify: true
