_format_version: "3.0"
services:
  - host: httpbin.konghq.com
    name: Flights_API
    path: /
    port: 443
    protocol: https
    routes:
      - methods:
          - GET
        name: Flights_API-getFlights
        paths:
          - ~/flights$
        regex_priority: 200
        strip_path: false
      - methods:
          - OPTIONS
        name: Flights_API-corsFlights
        paths:
          - ~/flights$
        regex_priority: 200
        strip_path: false
      - methods:
          - GET
        name: Flights_API-getFlightByNumber
        paths:
          - ~/flights/(?<flightNumber>[^#?/]+)$
        regex_priority: 100
        strip_path: false
      - methods:
          - OPTIONS
        name: Flights_API-corsFlightByNumber
        paths:
          - ~/flights/(?<flightNumber>[^#?/]+)$
        regex_priority: 100
        strip_path: false
      - methods:
          - GET
        name: Flights_API-getFlightDetails
        paths:
          - ~/flights/(?<flightNumber>[^#?/]+)/details$
        regex_priority: 100
        strip_path: false
      - methods:
          - OPTIONS
        name: Flights_API-corsFlightDetails
        paths:
          - ~/flights/(?<flightNumber>[^#?/]+)/details$
        regex_priority: 100
        strip_path: false
