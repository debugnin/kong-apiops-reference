AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Test upstreams for the KongAir Bookings (Lambda) and KongAir Flights
  (ECS/HTTP) APIs. Implements the endpoints defined in
  services/kongair-bookings/openapi.yaml. Includes a separate Kong invoker
  IAM role so that Kong's ECS task role can assume it to invoke the Lambda
  (AWS Lambda plugin with assumeRole).

# ─────────────────────────────────────────────────────────────────────────────
# Parameters
# ─────────────────────────────────────────────────────────────────────────────
Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, qa, uat, prd]
    Description: Deployment environment

  AppName:
    Type: String
    Default: kongair
    Description: Application name used for resource naming

  KongEcsTaskRoleArn:
    Type: String
    Description: >
      ARN of the Kong ECS task role (kong-<AppName>-task-role-<Environment>).
      This role will be trusted by the Kong invoker role so Kong can call
      sts:AssumeRole and then lambda:InvokeFunction on the Bookings Lambda.


# ─────────────────────────────────────────────────────────────────────────────
# Resources
# ─────────────────────────────────────────────────────────────────────────────
Resources:
  # ---------------------------------------------------------------------------
  # 1. Lambda Execution Role
  #    Grants the Lambda function permission to write CloudWatch Logs.
  # ---------------------------------------------------------------------------
  BookingsLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "kongair-bookings-test-lambda-execution-role-${Environment}"
      Description: Execution role for the kongair-bookings test Lambda function
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: kongair-bookings
        - Key: ManagedBy
          Value: CloudFormation

  # ---------------------------------------------------------------------------
  # 2. Bookings Test Lambda Function
  #    Handles every endpoint defined in services/kongair-bookings/openapi.yaml:
  #      GET    /bookings
  #      POST   /bookings
  #      GET    /bookings/{ticketNumber}
  #      DELETE /bookings/{ticketNumber}
  #    OPTIONS requests on every path return CORS headers.
  #
  #    Kong invokes this function via the AWS Lambda plugin using the event
  #    format produced by the plugin (REST-like proxy payload).
  # ---------------------------------------------------------------------------
  BookingsTestLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "kongair-bookings-api-test-${AppName}-${Environment}"
      Description: >
        Test stub for the KongAir Bookings API service. Returns mock responses
        for all endpoints defined in services/kongair-bookings/openapi.yaml.
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt BookingsLambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 256
      Code:
        ZipFile: |
          'use strict';
          const { randomUUID } = require('crypto');

          // ── helpers ────────────────────────────────────────────────────────

          const makeTicketNumber = () =>
            randomUUID().replace(/-/g, '').slice(0, 7).toUpperCase();

          const withCors = (headers) => ({
            ...headers,
            'Access-Control-Allow-Origin': '*',
            'Access-Control-Allow-Methods': 'GET,POST,DELETE,OPTIONS',
            'Access-Control-Allow-Headers': 'Content-Type,Authorization',
          });

          const resp = (statusCode, body, headers) => ({
            statusCode,
            headers,
            body: JSON.stringify(body),
          });

          const corsResp = (headers) => resp(200, { message: 'OK' }, withCors(headers));

          const parseBody = (event) => {
            // Kong Lambda plugin sends body as request_body (string) or request_body_args (object)
            const raw = event.request_body || event.request_body_args;
            if (!raw) return {};
            if (typeof raw === 'string') {
              try { return JSON.parse(raw); } catch { return {}; }
            }
            return raw;
          };

          const sampleBooking = (ticketNumber, flightNumber, seat) => ({
            ticket_number: ticketNumber,
            seat: seat || '32A',
            flight: {
              number: flightNumber || 'KA924',
              route_id: 'LHR-SFO',
              scheduled_departure: '2024-09-03T09:15:00Z',
              scheduled_arrival: '2024-09-03T14:23:00Z',
            },
          });

          // In-memory store so GET/DELETE after a POST behave consistently
          // within a single warm Lambda container. Resets on cold start —
          // this is a test stub, not a real datastore.
          const bookings = new Map([
            ['CDF3412', sampleBooking('CDF3412', 'KA924', '32A')],
            ['CDF3413', sampleBooking('CDF3413', 'KA925', '14C')],
          ]);

          // ── main handler ───────────────────────────────────────────────────

          exports.handler = async (event) => {
            console.log('EVENT', JSON.stringify(event, null, 2));

            const method = (event.request_method || 'GET').toUpperCase();
            const rawPath = (event.request_uri || '/').split('?')[0].replace(/\/$/, '');

            const rawHeaders = event.request_headers || {};
            const headers = Object.fromEntries(
              Object.entries(rawHeaders).map(([k, v]) => [k.toLowerCase(), v])
            );

            const baseHeaders = {
              'Content-Type': 'application/json',
              'Kong-Request-ID': headers['kong-request-id'] || randomUUID(),
            };

            // ── GET /bookings ──────────────────────────────────────────────────
            if (rawPath === '/bookings' && method === 'GET') {
              return resp(200, Array.from(bookings.values()), baseHeaders);
            }
            if (rawPath === '/bookings' && method === 'OPTIONS') {
              return corsResp(baseHeaders);
            }

            // ── POST /bookings ─────────────────────────────────────────────────
            if (rawPath === '/bookings' && method === 'POST') {
              const body = parseBody(event);
              if (!body.flight_number) {
                return resp(400, {
                  statusCode: 400,
                  code: 'BAD_REQUEST',
                  error: 'Bad Request',
                  message: 'flight_number is required',
                }, baseHeaders);
              }
              const ticketNumber = makeTicketNumber();
              bookings.set(ticketNumber, sampleBooking(ticketNumber, body.flight_number, body.seat));
              return resp(201, { ticket_number: ticketNumber }, baseHeaders);
            }

            // ── /bookings/{ticketNumber} ──────────────────────────────────────
            const ticketMatch = rawPath.match(/^\/bookings\/([^/]+)$/);
            if (ticketMatch) {
              const ticketNumber = ticketMatch[1];

              if (method === 'OPTIONS') return corsResp(baseHeaders);

              if (method === 'GET') {
                const booking = bookings.get(ticketNumber);
                if (!booking) {
                  return resp(404, {
                    statusCode: 404,
                    code: 'NOT_FOUND',
                    error: 'Not Found',
                    message: `No booking found for ticket ${ticketNumber}`,
                  }, baseHeaders);
                }
                return resp(200, booking, baseHeaders);
              }

              if (method === 'DELETE') {
                if (!bookings.has(ticketNumber)) {
                  return resp(404, {
                    statusCode: 404,
                    code: 'NOT_FOUND',
                    error: 'Not Found',
                    message: `No booking found for ticket ${ticketNumber}`,
                  }, baseHeaders);
                }
                bookings.delete(ticketNumber);
                return { statusCode: 204, headers: baseHeaders, body: '' };
              }
            }

            // ── fallback ──────────────────────────────────────────────────────
            return resp(404, {
              statusCode: 404,
              code: 'NOT_FOUND',
              error: 'Not Found',
              message: `Path not found: ${rawPath}`,
            }, baseHeaders);
          };

      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: kongair-bookings
        - Key: ManagedBy
          Value: CloudFormation

  # ---------------------------------------------------------------------------
  # 3. Kong Bookings Lambda Invoker Role
  #
  #    This is a SEPARATE role from Kong's own ECS task role.
  #    Purpose: provide a least-privilege boundary so that only the specific
  #    Kong task role (passed as KongEcsTaskRoleArn) can assume this role, and
  #    the role itself can only invoke the Bookings Lambda.
  #
  #    Kong configuration (AWS Lambda plugin):
  #      aws_assume_role_arn: <KongBookingsLambdaInvokerRole ARN>
  #      aws_region:          <region>
  #      function_name:       kongair-bookings-api-test-<AppName>-<Environment>
  # ---------------------------------------------------------------------------
  KongBookingsLambdaInvokerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "kong-bookings-lambda-invoker-role-${AppName}-${Environment}"
      Description: >
        Assumed by the Kong ECS task role to invoke the kongair-bookings test
        Lambda. Grants only lambda:InvokeFunction on the Bookings function.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref KongEcsTaskRoleArn
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeBookingsTestLambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt BookingsTestLambdaFunction.Arn
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: kongair-bookings
        - Key: ManagedBy
          Value: CloudFormation

  # ---------------------------------------------------------------------------
  # 4. Lambda Resource-Based Policy
  #
  #    Explicitly authorises the Kong invoker role to call InvokeFunction on
  #    the Bookings Lambda at the resource level (defence-in-depth; same account).
  # ---------------------------------------------------------------------------
  BookingsLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt BookingsTestLambdaFunction.Arn
      Action: lambda:InvokeFunction
      Principal: !GetAtt KongBookingsLambdaInvokerRole.Arn

  # ---------------------------------------------------------------------------
  # 5. VPC for the kongair-flights ECS service
  #
  #    Self-contained VPC with two public subnets across different AZs.
  #    Both the ALB and ECS tasks use these subnets (AssignPublicIp: ENABLED).
  # ---------------------------------------------------------------------------
  FlightsVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "kongair-flights-vpc-${AppName}-${Environment}"
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  FlightsInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "kongair-flights-igw-${AppName}-${Environment}"
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  FlightsVpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref FlightsVpc
      InternetGatewayId: !Ref FlightsInternetGateway

  FlightsPublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FlightsVpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "kongair-flights-public-subnet-1-${AppName}-${Environment}"
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  FlightsPublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FlightsVpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "kongair-flights-public-subnet-2-${AppName}-${Environment}"
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  FlightsPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref FlightsVpc
      Tags:
        - Key: Name
          Value: !Sub "kongair-flights-public-rt-${AppName}-${Environment}"
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  FlightsPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: FlightsVpcGatewayAttachment
    Properties:
      RouteTableId: !Ref FlightsPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref FlightsInternetGateway

  FlightsSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref FlightsPublicSubnet1
      RouteTableId: !Ref FlightsPublicRouteTable

  FlightsSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref FlightsPublicSubnet2
      RouteTableId: !Ref FlightsPublicRouteTable

  # ---------------------------------------------------------------------------
  # 6. Flights Test Service – ECS (Fargate) + ALB
  #
  #    Provides a normal HTTP upstream to contrast with the Lambda-backed
  #    Bookings service. Uses the kennethreitz/httpbin Docker image (port 80)
  #    as a stand-in for the real kongair-flights service — it echoes back
  #    whatever Kong sends, which is enough to prove the routing end to end.
  #
  #    Kong service configuration (kongair-flights):
  #      host:     <FlightsAlbDnsName>
  #      port:     80
  #      protocol: http
  #      path:     /anything
  # ---------------------------------------------------------------------------

  # Security group for the ALB — accepts HTTP from anywhere
  FlightsAlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "kongair-flights ALB inbound HTTP - ${AppName} ${Environment}"
      VpcId: !Ref FlightsVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "kongair-flights-alb-sg-${AppName}-${Environment}"
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: kongair-flights
        - Key: ManagedBy
          Value: CloudFormation

  # Security group for ECS tasks — accepts HTTP only from the ALB SG
  FlightsEcsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "kongair-flights ECS task inbound from ALB - ${AppName} ${Environment}"
      VpcId: !Ref FlightsVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref FlightsAlbSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "kongair-flights-ecs-sg-${AppName}-${Environment}"
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: kongair-flights
        - Key: ManagedBy
          Value: CloudFormation

  # ECS task execution role — allows ECS agent to pull image and write logs
  FlightsEcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "kongair-flights-ecs-exec-role-${AppName}-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: kongair-flights
        - Key: ManagedBy
          Value: CloudFormation

  # ECS cluster
  FlightsEcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "kongair-flights-test-${AppName}-${Environment}"
      CapacityProviders:
        - FARGATE
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: kongair-flights
        - Key: ManagedBy
          Value: CloudFormation

  # CloudWatch log group (7-day retention — test service)
  FlightsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/kongair-flights-test-${AppName}-${Environment}"
      RetentionInDays: 7

  # Fargate task definition — kennethreitz/httpbin listens on port 80
  FlightsTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "kongair-flights-test-${AppName}-${Environment}"
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt FlightsEcsTaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: httpbin
          Image: kennethreitz/httpbin:latest
          PortMappings:
            - ContainerPort: 80
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref FlightsLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: httpbin
          Essential: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: kongair-flights
        - Key: ManagedBy
          Value: CloudFormation

  # ALB target group — health-checked via GET /get (httpbin echo endpoint)
  FlightsTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "kongair-flights-tg-${AppName}-${Environment}"
      Protocol: HTTP
      Port: 80
      VpcId: !Ref FlightsVpc
      TargetType: ip
      HealthCheckPath: /get
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: kongair-flights
        - Key: ManagedBy
          Value: CloudFormation

  # Internet-facing ALB
  FlightsAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "kongair-flights-alb-${AppName}-${Environment}"
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref FlightsPublicSubnet1
        - !Ref FlightsPublicSubnet2
      SecurityGroups:
        - !Ref FlightsAlbSecurityGroup
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: kongair-flights
        - Key: ManagedBy
          Value: CloudFormation

  # HTTP listener — forwards all traffic to the flights target group
  FlightsAlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref FlightsAlb
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FlightsTargetGroup

  # Fargate service — single task, registered behind the ALB
  FlightsEcsService:
    Type: AWS::ECS::Service
    DependsOn: FlightsAlbListener
    Properties:
      ServiceName: !Sub "kongair-flights-test-${AppName}-${Environment}"
      Cluster: !Ref FlightsEcsCluster
      TaskDefinition: !Ref FlightsTaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
              - !Ref FlightsPublicSubnet1
              - !Ref FlightsPublicSubnet2
          SecurityGroups:
            - !Ref FlightsEcsSecurityGroup
          AssignPublicIp: ENABLED
      LoadBalancers:
        - ContainerName: httpbin
          ContainerPort: 80
          TargetGroupArn: !Ref FlightsTargetGroup
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: kongair-flights
        - Key: ManagedBy
          Value: CloudFormation

# ─────────────────────────────────────────────────────────────────────────────
# Outputs
# ─────────────────────────────────────────────────────────────────────────────
Outputs:
  LambdaFunctionArn:
    Description: ARN of the kongair-bookings test Lambda function
    Value: !GetAtt BookingsTestLambdaFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-LambdaArn"

  LambdaFunctionName:
    Description: Name of the kongair-bookings test Lambda function
    Value: !Ref BookingsTestLambdaFunction
    Export:
      Name: !Sub "${AWS::StackName}-LambdaName"

  KongInvokerRoleArn:
    Description: >
      ARN of the Kong invoker role. Use this as aws_assume_role_arn in the
      Kong AWS Lambda plugin configuration for the kongair-bookings service.
    Value: !GetAtt KongBookingsLambdaInvokerRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-KongInvokerRoleArn"

  LambdaExecutionRoleArn:
    Description: ARN of the Lambda execution role
    Value: !GetAtt BookingsLambdaExecutionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-LambdaExecutionRoleArn"

  FlightsServiceUrl:
    Description: >
      HTTP URL of the kongair-flights test service. Use this as
      KONGAIR_FLIGHTS_UPSTREAM_URL for the Kong kongair-flights service.
    Value: !Sub "http://${FlightsAlb.DNSName}"
    Export:
      Name: !Sub "${AWS::StackName}-FlightsServiceUrl"

  FlightsAlbDnsName:
    Description: DNS name of the kongair-flights ALB (without scheme)
    Value: !GetAtt FlightsAlb.DNSName
    Export:
      Name: !Sub "${AWS::StackName}-FlightsAlbDnsName"
